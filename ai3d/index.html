<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/project-icon.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>图生3D</title>
    <script>(function(){var b=/^(localhost|127\.0\.0\.1)$/i.test(location.hostname)?'http://localhost:18080':'https://api.cc2.cx',logo=b+'/logo.jpg',selector='[data-sub2api-site-logo]';function resolve(value){if(typeof value!=='string'||!value.trim())return b+'/logo.jpg';var v=value.trim();if(v.indexOf('data:image/')===0)return v;if(v.indexOf('//')===0)return b+'/logo.jpg';try{var u=new URL(v,b+'/');return u.protocol==='http:'||u.protocol==='https:'?u.href:b+'/logo.jpg'}catch(_){return b+'/logo.jpg'}}function patch(root){if(root.nodeType!==1)return;if(root.matches(selector)&&root instanceof HTMLImageElement&&root.src!==logo)root.src=logo;root.querySelectorAll(selector).forEach(function(image){if(image instanceof HTMLImageElement&&image.src!==logo)image.src=logo})}function apply(value){logo=resolve(value);var icon=document.querySelector('link[rel~="icon"]');if(!icon){icon=document.createElement('link');icon.rel='icon';document.head.appendChild(icon)}if(icon.href!==logo)icon.href=logo;patch(document.documentElement);window.__SUB2API_SITE_LOGO__=logo;window.dispatchEvent(new Event('sub2api-logo-updated'))}apply('');new MutationObserver(function(records){records.forEach(function(record){if(record.type==='attributes')patch(record.target);record.addedNodes.forEach(patch)})}).observe(document.documentElement,{subtree:true,childList:true,attributes:true,attributeFilter:['src']});var loading=false;function load(){if(loading)return;loading=true;fetch(b+'/api/v1/settings/public',{credentials:'omit',cache:'no-store',headers:{Accept:'application/json'}}).then(function(r){return r.ok?r.json():null}).then(function(x){apply(x&&x.data&&x.data.site_logo)}).catch(function(){apply('')}).finally(function(){loading=false})}load();window.addEventListener('focus',load);document.addEventListener('visibilitychange',function(){if(!document.hidden)load()})})();</script>
    <script src="/sub2api-balance-widget.js" defer></script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
