name: open-ai-canvas-dev

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.dev
      args:
        GO_IMAGE: ${GO_IMAGE:-golang:1.25-alpine}
        GOPROXY: ${GOPROXY:-https://goproxy.cn,direct}
        ALPINE_MIRROR: ${ALPINE_MIRROR:-}
    working_dir: /workspace/backend
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    environment:
      HOME: /tmp
      GOCACHE: /tmp/go-build
      GOMODCACHE: /tmp/go-mod
      CANVAS_BACKEND_ADDR: ":8080"
      CANVAS_BACKEND_DATA_DIR: /data
      CANVAS_DATABASE_DRIVER: ${CANVAS_DATABASE_DRIVER:-sqlite}
      CANVAS_AUTO_MIGRATE: ${CANVAS_AUTO_MIGRATE:-false}
      DATABASE_URL: ${DATABASE_URL:-}
      REDIS_URL: ${REDIS_URL:-}
      CANVAS_WORKER_CONCURRENCY: ${CANVAS_WORKER_CONCURRENCY:-3}
      CANVAS_CHANNEL_CONCURRENCY: ${CANVAS_CHANNEL_CONCURRENCY:-3}
      CANVAS_REGISTRATION_ENABLED: ${CANVAS_REGISTRATION_ENABLED:-false}
      CANVAS_ALLOW_PRIVATE_UPSTREAMS: ${CANVAS_ALLOW_PRIVATE_UPSTREAMS:-false}
      CANVAS_ALLOWED_PRIVATE_UPSTREAM_HOSTS: ${CANVAS_ALLOWED_PRIVATE_UPSTREAM_HOSTS:-}
      CANVAS_CORS_ORIGINS: ${CANVAS_CORS_ORIGINS:-http://localhost:3000}
      SUB2API_SSO_SECRET: ${SUB2API_SSO_SECRET:-}
      SUB2API_APP_CREDENTIAL: ${SUB2API_APP_CREDENTIAL:-}
      LINK: ${LINK:-}
      SUB2API_RELAY_BASE_URL: ${SUB2API_RELAY_BASE_URL:-${LINK:-}}
      SUB2API_RELAY_MODELS: ${SUB2API_RELAY_MODELS:-gpt-5.6-sol}
      SUB2API_RELAY_IMAGE_MODELS: ${SUB2API_RELAY_IMAGE_MODELS:-gpt-image-2}
      SUB2API_RELAY_VIDEO_MODELS: ${SUB2API_RELAY_VIDEO_MODELS:-minimax_h3_z0901,minimax_h3_z0903,minimax_h3_z0902,minimax_h3_zm_u24,minimax_h3_zm_u08,minimax_h3_b99_002,minimax_h3_b99_001,minimax_h3_b99_003_12s,wan2.2animate-v4-motion_retargeting,minimax_h3_image_audio_to_video_v2_15s,minimax_h3_lightx2v_v5_15s,minimax_h3_image_audio_to_video_v2,minimax_h3_image_audio_to_video,minimax_h3_lightx2v_v5,minimax_h3_lightx2v_no_pic,minimax_h3_lightx2v}
      SUB2API_RELAY_ALLOW_LOCAL: ${SUB2API_RELAY_ALLOW_LOCAL:-false}
      GIN_MODE: debug
    volumes:
      - type: bind
        source: .
        target: /workspace
      # 禁止 Compose 静默创建新数据目录，避免开发时误用另一套账号数据。
      - type: bind
        source: ./.local/project-workbench-debug
        target: /data
        bind:
          create_host_path: false
      # 持久化首次下载和 CGO 编译结果，容器重建后继续复用开发缓存。
      - type: bind
        source: ./.local/cache/go-build
        target: /tmp/go-build
        bind:
          create_host_path: false
      - type: bind
        source: ./.local/cache/go-mod
        target: /tmp/go-mod
        bind:
          create_host_path: false
    ports:
      - "127.0.0.1:${CANVAS_BACKEND_HOST_PORT:-8080}:8080"
    init: true

  web:
    image: oven/bun:1.3.13
    working_dir: /workspace/web
    command: ["sh", "-c", "bun install --frozen-lockfile && bun run dev"]
    environment:
      VITE_API_PROXY_TARGET: http://backend:8080
      VITE_TLDRAW_LICENSE_KEY: ${VITE_TLDRAW_LICENSE_KEY:-}
    volumes:
      - type: bind
        source: .
        target: /workspace
      - web-node-modules:/workspace/web/node_modules
      - web-bun-cache:/root/.bun/install/cache
    ports:
      - "${CANVAS_WEB_HOST_PORT:-3000}:3000"
    depends_on:
      - backend
    init: true

volumes:
  web-node-modules:
  web-bun-cache:
