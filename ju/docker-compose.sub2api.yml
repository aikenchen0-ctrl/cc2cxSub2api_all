# Overlay for an existing Sub2API deployment. Keep databases on the default network.
services:
  backend:
    environment:
      CANVAS_AUTO_MIGRATE: "false"
      CANVAS_ALLOW_PRIVATE_UPSTREAMS: "false"
      CANVAS_ALLOWED_PRIVATE_UPSTREAM_HOSTS: ${CANVAS_ALLOWED_PRIVATE_UPSTREAM_HOSTS:-sub2api}
      SUB2API_RELAY_BASE_URL: ${SUB2API_RELAY_BASE_URL:-http://sub2api:8080/v1}
      # Container gateway access uses the host allowlist, never desktop loopback mode.
      SUB2API_RELAY_ALLOW_LOCAL: "false"
      SUB2API_APP_CREDENTIAL: ${SUB2API_APP_CREDENTIAL:-}
      SUB2API_RELAY_MODELS: ${SUB2API_RELAY_MODELS:-gpt-5.6-sol}
      SUB2API_RELAY_IMAGE_MODELS: ${SUB2API_RELAY_IMAGE_MODELS:-gpt-image-2}
      SUB2API_RELAY_VIDEO_MODELS: ${SUB2API_RELAY_VIDEO_MODELS:-minimax_h3_z0901,minimax_h3_z0903,minimax_h3_z0902,minimax_h3_zm_u24,minimax_h3_zm_u08,minimax_h3_b99_002,minimax_h3_b99_001,minimax_h3_b99_003_12s,wan2.2animate-v4-motion_retargeting,minimax_h3_image_audio_to_video_v2_15s,minimax_h3_lightx2v_v5_15s,minimax_h3_image_audio_to_video_v2,minimax_h3_image_audio_to_video,minimax_h3_lightx2v_v5,minimax_h3_lightx2v_no_pic,minimax_h3_lightx2v}
      LINK: ${LINK:-}
      REDIS_URL: ${REDIS_URL:-redis://sso-redis:6379/0}
    depends_on:
      sso-redis:
        condition: service_healthy
    networks:
      - default
      - sub2api

  sso-redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "always"]
    volumes:
      - sso-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

networks:
  sub2api:
    external: true
    name: ${SUB2API_DOCKER_NETWORK:-deploy_sub2api-network}

volumes:
  sso-redis-data:
