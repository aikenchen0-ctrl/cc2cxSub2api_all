<!doctype html>
<html lang="zh-CN" class="font-sans">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="icon" type="image/jpeg" href="/project-icon.jpg" />
        <meta name="description" content="AI 影视与短剧创作工作台" />
        <title>AI导演台</title>
        <script>
            (function () {
                var b = /^(localhost|127\.0\.0\.1)$/i.test(location.hostname) ? "http://localhost:18080" : "https://api.cc2.cx";
                var logo = b + "/logo.jpg";
                var iconSelector = 'link[rel~="icon"]';
                var imageSelector = "[data-sub2api-site-logo]";
                function resolve(value) {
                    if (typeof value !== "string" || !value.trim()) return b + "/logo.jpg";
                    var v = value.trim();
                    if (v.indexOf("data:image/") === 0) return v;
                    try {
                        var url = new URL(v, b + "/");
                        return url.protocol === "http:" || url.protocol === "https:" ? url.href : b + "/logo.jpg";
                    } catch (_) {
                        return b + "/logo.jpg";
                    }
                }
                function patch(root) {
                    if (!root || root.nodeType !== 1) return;
                    if (root.matches(iconSelector) && root.href !== logo) root.href = logo;
                    if (root.matches(imageSelector) && root instanceof HTMLImageElement && root.src !== logo) root.src = logo;
                    root.querySelectorAll(iconSelector).forEach(function (icon) { if (icon.href !== logo) icon.href = logo; });
                    root.querySelectorAll(imageSelector).forEach(function (image) {
                        if (image instanceof HTMLImageElement && image.src !== logo) image.src = logo;
                    });
                }
                function apply(value) {
                    logo = resolve(value);
                    var icons = document.querySelectorAll(iconSelector);
                    if (!icons.length) {
                        var icon = document.createElement("link");
                        icon.rel = "icon";
                        document.head.appendChild(icon);
                        icons = document.querySelectorAll(iconSelector);
                    }
                    icons.forEach(function (icon) { if (icon.href !== logo) icon.href = logo; });
                    patch(document.documentElement);
                    window.__SUB2API_SITE_LOGO__ = logo;
                    window.dispatchEvent(new Event("sub2api-logo-updated"));
                }
                var loading = false;
                function load() {
                    if (loading) return;
                    loading = true;
                    fetch(b + "/api/v1/settings/public", {
                        credentials: "omit",
                        cache: "no-store",
                        headers: { Accept: "application/json" }
                    })
                        .then(function (response) { return response.ok ? response.json() : null; })
                        .then(function (settings) { apply(settings && settings.data && settings.data.site_logo); })
                        .catch(function () { apply(""); })
                        .finally(function () { loading = false; });
                }
                apply("");
                new MutationObserver(function (records) {
                    records.forEach(function (record) {
                        if (record.type === "attributes") patch(record.target);
                        record.addedNodes.forEach(patch);
                    });
                }).observe(document.documentElement, {
                    subtree: true,
                    childList: true,
                    attributes: true,
                    attributeFilter: ["src", "href"]
                });
                load();
                window.addEventListener("focus", load);
                document.addEventListener("visibilitychange", function () { if (!document.hidden) load(); });
            })();
        </script>
        <style>
            html,
            body {
                margin: 0;
                background: #0b0c10;
            }
            #root:empty {
                min-height: 100vh;
            }
            #root:empty::before {
                content: "";
                position: fixed;
                left: 50%;
                top: 50%;
                width: 12px;
                height: 12px;
                margin: -6px 0 0 -6px;
                background: rgba(255, 255, 255, 0.84);
                border-radius: 999px;
                box-shadow: 0 0 0 7px rgba(255, 255, 255, 0.08);
                animation: appearance-bootstrap-pulse 1.8s ease-in-out infinite;
            }
            #root:empty::after {
                content: "";
                position: fixed;
                left: 50%;
                top: 50%;
                width: 82px;
                height: 82px;
                margin: -42px 0 0 -42px;
                border: 1px solid rgba(255, 255, 255, 0.14);
                border-right-color: transparent;
                border-radius: 999px;
                animation: appearance-bootstrap-orbit 2.8s linear infinite;
            }
            @keyframes appearance-bootstrap-pulse { 0%, 100% { opacity: .62; transform: scale(.82); } 50% { opacity: 1; transform: scale(1.08); } }
            @keyframes appearance-bootstrap-orbit { to { transform: rotate(360deg); } }
            @media (prefers-reduced-motion: reduce) {
                #root:empty::before,
                #root:empty::after {
                    animation: none;
                }
            }
        </style>
        <script>
            try {
                var s = JSON.parse(localStorage.getItem("infinite-canvas:theme_store") || "{}");
                var t = s.state && s.state.theme === "light" ? "light" : "dark";
                document.documentElement.classList.toggle("dark", t === "dark");
                document.documentElement.style.colorScheme = t;
            } catch (e) {}
        </script>
    </head>
    <body class="bg-background text-foreground antialiased">
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
