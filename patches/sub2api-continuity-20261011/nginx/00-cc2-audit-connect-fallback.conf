upstream cc2_audit_connect_safe {
    server 127.0.0.1:18489 max_fails=1 fail_timeout=5s;
    server 127.0.0.1:19689 backup;
    keepalive 32;
}

map $cc2_audit_backend $cc2_audit_connect_backend {
    default $cc2_audit_backend;
    "http://127.0.0.1:18489/openai" "http://cc2_audit_connect_safe/openai";
}

server {
    listen 127.0.0.1:19689;
    server_name localhost;
    client_max_body_size 256m;
    access_log /var/log/nginx/cc2-audit-connect-fallback.log combined;

    location /openai/ {
        rewrite ^/openai/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:28080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header helicone-api-key "";
        proxy_set_header helicone-property-sub2api-user-id "";
        proxy_set_header helicone-property-sub2api-api-key-id "";
        proxy_set_header helicone-property-audit-request-id "";
        proxy_set_header helicone-property-audit-source "";
        proxy_set_header helicone-user-id "";
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_connect_timeout 3s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_next_upstream off;
    }
    location / {
        return 404;
    }
}
