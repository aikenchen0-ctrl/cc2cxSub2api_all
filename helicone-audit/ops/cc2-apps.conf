server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name aicut.cc2.cx;
    ssl_certificate /etc/letsencrypt/live/cc2.cx-apps/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cc2.cx-apps/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 1024m;
    include /etc/nginx/snippets/cc2-cors.conf;
    location / { proxy_pass http://127.0.0.1:5199; include /etc/nginx/snippets/cc2-proxy.conf; proxy_set_header Host localhost; proxy_set_header X-Forwarded-Host localhost; proxy_set_header X-Forwarded-Server localhost; }
}

