map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
}

server {
    listen 80;
    listen [::]:80;
    server_name cc2.cx api.cc2.cx aicut.cc2.cx aiexcel.cc2.cx canvas.cc2.cx ju.cc2.cx livart.cc2.cx ppt.cc2.cx qrcode.cc2.cx screen2code.cc2.cx;
    client_max_body_size 256m;
    include /etc/nginx/snippets/cc2-cors.conf;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 308 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.cc2.cx;
    ssl_certificate /etc/letsencrypt/live/cc2.cx-apps/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cc2.cx-apps/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 256m;
    include /etc/nginx/snippets/cc2-cors.conf;
    include /etc/nginx/snippets/cc2-audit-locations.conf;
    location / {
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/snippets/cc2-proxy.conf;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name cc2.cx;
    ssl_certificate /etc/letsencrypt/live/cc2.cx/fullchain.pem;
