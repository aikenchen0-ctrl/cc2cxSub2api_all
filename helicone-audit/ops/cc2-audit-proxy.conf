proxy_pass $cc2_audit_backend$request_uri;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header Authorization $http_authorization;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;
proxy_set_header helicone-api-key $cc2_audit_secret;
proxy_set_header helicone-property-sub2api-user-id $cc2_audit_user;
proxy_set_header helicone-property-sub2api-api-key-id $cc2_audit_key_id;
proxy_set_header helicone-property-audit-request-id $request_id;
proxy_set_header helicone-property-audit-source nginx-production;
proxy_set_header helicone-user-id $cc2_audit_user;
proxy_set_header helicone-omit-request "";
proxy_set_header helicone-omit-response "";
proxy_set_header x-helicone-webhook-enabled "";
proxy_set_header x-helicone-posthog-api-key "";
proxy_set_header x-helicone-posthog-host "";
proxy_set_header x-helicone-lytix-key "";
proxy_set_header x-helicone-model-override "";
proxy_set_header helicone-target-url "";
proxy_set_header Cookie "";
proxy_connect_timeout 3s;
proxy_send_timeout 3600s;
proxy_read_timeout 3600s;
proxy_next_upstream off;
proxy_request_buffering off;
proxy_buffering off;
proxy_hide_header Access-Control-Max-Age;
proxy_hide_header Access-Control-Expose-Headers;
proxy_hide_header Access-Control-Allow-Headers;
proxy_hide_header Access-Control-Allow-Methods;
proxy_hide_header Access-Control-Allow-Credentials;
proxy_hide_header Access-Control-Allow-Origin;
