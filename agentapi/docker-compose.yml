services:
  agentapi:
    build:
      context: .
      dockerfile: Dockerfile
    image: cc2cx/agentapi:latest
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      # Keep the repository's documented local port stable. Falling back to
      # 8080 collides with the local Sub2API service and can leave AgentAPI
      # stopped after an otherwise successful image upgrade.
      - "${AGENTAPI_PORT:-18081}:8080"
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      AGENTAPI_ADDR: ":8080"
      AGENTAPI_WEB_DIR: /app/web
      AGENTAPI_DATABASE_PATH: /app/data/agentapi.db
      AGENTAPI_SHARED_HOSTS: ${AGENTAPI_SHARED_HOSTS:-localhost,127.0.0.1}
      # Shared mode must win over stale values that may still exist in an old
      # backend/.env. These variables are only for an explicit one-off legacy
      # migration run and must not bind the normal Compose service to one tenant.
      AGENT_ID: ""
      AGENT_DOMAIN: ""
      AGENT_OWNER_MAIN_USER_ID: ""
      # The public-layer ticket is signed by Sub2API. Keep this injected from
      # the same deployment env file instead of relying on a stale container.
      SUB2API_SSO_SECRET: ${SUB2API_SSO_SECRET:?SUB2API_SSO_SECRET is required}
      AGENTAPI_SSO_AUDIENCE: agentapi
      AGENT_ENABLED: ${AGENT_ENABLED:-true}
      MODEL_STREAM_TIMEOUT: ${MODEL_STREAM_TIMEOUT:-10m}
      AGENTAPI_WRITE_TIMEOUT: ${AGENTAPI_WRITE_TIMEOUT:-10m}
      AGENT_SETTLEMENT_RECONCILE_INTERVAL: ${AGENT_SETTLEMENT_RECONCILE_INTERVAL:-5m}
      AGENT_SETTLEMENT_RECONCILE_BATCH: ${AGENT_SETTLEMENT_RECONCILE_BATCH:-50}
    volumes:
      - agentapi-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    stop_grace_period: 20s

volumes:
  agentapi-data:
