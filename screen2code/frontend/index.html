<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/project-icon.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;700&display=swap"
      rel="stylesheet"
    />

    <!-- Injected code for hosted version -->
    <%- injectHead %>
    <script src="/sub2api-balance-widget.js" defer></script>

    <title>AI一键复刻网站</title>
    <script>(function(){var b=/^(localhost|127\.0\.0\.1)$/i.test(location.hostname)?'http://localhost:18080':'https://api.cc2.cx',logo=b+'/logo.jpg',selector='[data-sub2api-site-logo]';function resolve(value){if(typeof value!=='string'||!value.trim())return b+'/logo.jpg';var v=value.trim();if(v.indexOf('data:image/')===0)return v;if(v.indexOf('//')===0)return b+'/logo.jpg';try{var u=new URL(v,b+'/');return u.protocol==='http:'||u.protocol==='https:'?u.href:b+'/logo.jpg'}catch(_){return b+'/logo.jpg'}}function apply(value){logo=resolve(value);var icon=document.querySelector('link[rel~="icon"]');if(!icon){icon=document.createElement('link');icon.rel='icon';document.head.appendChild(icon)}if(icon.href!==logo)icon.href=logo;function patch(root){if(root.nodeType!==1)return;if(root.matches(selector)&&root instanceof HTMLImageElement&&root.src!==logo)root.src=logo;root.querySelectorAll(selector).forEach(function(image){if(image instanceof HTMLImageElement&&image.src!==logo)image.src=logo})}patch(document.documentElement);window.__SUB2API_SITE_LOGO__=logo;window.dispatchEvent(new Event('sub2api-logo-updated'))}apply('');new MutationObserver(function(records){records.forEach(function(record){if(record.type==='attributes'&&record.target.matches(selector)&&record.target.src!==logo)record.target.src=logo;record.addedNodes.forEach(function(node){if(node.nodeType!==1)return;if(node.matches(selector)&&node instanceof HTMLImageElement&&node.src!==logo)node.src=logo;node.querySelectorAll(selector).forEach(function(image){if(image instanceof HTMLImageElement&&image.src!==logo)image.src=logo})})})}).observe(document.documentElement,{subtree:true,childList:true,attributes:true,attributeFilter:['src']});var loading=false;function load(){if(loading)return;loading=true;fetch(b+'/api/v1/settings/public',{credentials:'omit',cache:'no-store',headers:{Accept:'application/json'}}).then(function(r){return r.ok?r.json():null}).then(function(x){apply(x&&x.data&&x.data.site_logo)}).catch(function(){apply('')}).finally(function(){loading=false})}load();window.addEventListener('focus',load);document.addEventListener('visibilitychange',function(){if(!document.hidden)load()})})();</script>

    <!-- Open Graph Meta Tags -->
    <meta property="og:title" content="AI一键复刻网站" />
    <meta
      property="og:description"
      content="Convert any screenshot or design to clean code"
    />
    <meta
      property="og:image"
      content="https://screenshottocode.com/brand/twitter-summary-card.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="628" />
    <meta property="og:url" content="https://screenshottocode.com" />
    <meta property="og:type" content="website" />
    <!-- Twitter Card tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@picoapps" />
    <!-- Keep in sync with og:title, og:description and og:image -->
    <meta name="twitter:title" content="AI一键复刻网站" />
    <meta
      name="twitter:description"
      content="Convert any screenshot or design to clean code"
    />
    <meta
      name="twitter:image"
      content="https://screenshottocode.com/brand/twitter-summary-card.png"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
