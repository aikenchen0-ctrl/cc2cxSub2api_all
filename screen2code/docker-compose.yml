services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      LINK: http://sub2api:8080
      SUB2API_RELAY_BASE_URL: http://sub2api:8080/v1
      SUB2API_SSO_SECRET: ${SUB2API_SSO_SECRET:-}
      SUB2API_APP_CREDENTIAL: ${SUB2API_APP_CREDENTIAL:-}
      SCREEN2CODE_AUTH_REQUIRED: ${SCREEN2CODE_AUTH_REQUIRED:-true}
    ports:
      - "${BACKEND_PORT:-7001}:7001"
    command: poetry run uvicorn main:app --host 0.0.0.0 --port 7001
    restart: unless-stopped
    volumes:
      - ./backend/data:/app/data
    networks:
      - default
      - sub2api-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      PROXY_CODEGEN_BACKEND: http://backend:7001
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - default
      - sub2api-network

networks:
  sub2api-network:
    external: true
    name: ${SUB2API_DOCKER_NETWORK:-deploy_sub2api-network}
