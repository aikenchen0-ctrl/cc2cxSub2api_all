<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/openchatcut-icon.png" />
    <meta name="color-scheme" content="dark" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>cut000</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- The Docker image serves Vite without an HMR client. Some transformed
         React modules still contain Fast Refresh registration hooks; keep them
         harmless so a missing dev runtime cannot leave the root blank. -->
    <script>
      globalThis.$RefreshReg$ = globalThis.$RefreshReg$ || (() => {});
      globalThis.$RefreshSig$ = globalThis.$RefreshSig$ || (() => (type) => type);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
