server {
    listen 80;
    listen [::]:80;
    server_name yibiao.cc2.cx ai3d.cc2.cx aihuoke.cc2.cx agentapi.cc2.cx;
    client_max_body_size 1024m;
    include /etc/nginx/snippets/cc2-cors.conf;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 308 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name yibiao.cc2.cx;
    ssl_certificate /etc/letsencrypt/live/cc2.cx-apps/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cc2.cx-apps/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 1024m;
    include /etc/nginx/snippets/cc2-cors.conf;
    location / { proxy_pass http://127.0.0.1:8081; include /etc/nginx/snippets/cc2-proxy.conf; }
}

