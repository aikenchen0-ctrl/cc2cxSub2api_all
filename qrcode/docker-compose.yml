services:
  qrcode:
    build:
      context: .
      dockerfile: Dockerfile
    image: sub2api/qrcode:online-http
    container_name: qrcode
    restart: unless-stopped
    ports:
      - "${QRCODE_PORT:-5221}:5221"
    environment:
      NODE_ENV: production
      PORT: 5221
      QR_CORS_ORIGIN: ${QR_CORS_ORIGIN:-http://localhost:5221}
      QR_API_BASE_URL: ${QR_API_BASE_URL:-}
      LINK: ${LINK:-http://sub2api:8080}
      SUB2API_SSO_SECRET: ${SUB2API_SSO_SECRET:-}
      SUB2API_APP_CREDENTIAL: ${SUB2API_APP_CREDENTIAL:-}
      QR_IMAGE_MODEL: ${QR_IMAGE_MODEL:-gpt-image-2}
      QR_SESSION_SECRET: ${QR_SESSION_SECRET:-${SUB2API_SSO_SECRET:-}}
    networks:
      - default
      - sub2api-network

networks:
  sub2api-network:
    external: true
    name: ${SUB2API_DOCKER_NETWORK:-deploy_sub2api-network}
