# Run with: docker compose --env-file .env.sub2api -f docker-compose.yml -f docker-compose.sub2api.yml up -d --no-deps production
services:
  production:
    image: ppt:sub2api-integration
    env_file:
      - .env.sub2api
    environment:
      LINK: ${LINK:-localhost:18080}
      SUB2API_SSO_SECRET: ${SUB2API_SSO_SECRET:?SUB2API_SSO_SECRET must be set in .env.sub2api}
      SUB2API_APP_CREDENTIAL: ${SUB2API_APP_CREDENTIAL:?SUB2API_APP_CREDENTIAL must be set in .env.sub2api}
      SUB2API_RELAY_BASE_URL: ${SUB2API_RELAY_BASE_URL:-http://sub2api:8080/v1}
      SUB2API_BASE_URL: ${SUB2API_BASE_URL:-}
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
